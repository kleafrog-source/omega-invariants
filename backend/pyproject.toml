[tool.poetry]
name = "omega-invariants-backend"
version = "0.1.0"
description = "Offline-first Omega invariants backend"
authors = ["mungo"]
readme = "../README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.0"
numpy = "^2.0.0"
scipy = "^1.13.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
httpx = "^0.27.0"
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
